name: smartbite
description: Digital Occlusal Analysis App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.2.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3
  pdf: ^3.10.8
  printing: ^5.13.0
  path_provider: ^2.1.3
  uuid: ^4.3.3
  lottie: ^3.1.0

dependency_overrides:
  path_provider_android: 2.2.12
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true